version: '3.8'

# Estrutura base de serviços para o ecossistema TitanSystem
# Este arquivo sobe o banco de dados principal (PostgreSQL), 
# a fila para logística (Redis), o backend central e o painel web.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=titan
      - DB_PASSWORD=titanpass
      - DB_NAME=titansystem
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend-web
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=titan
      - POSTGRES_PASSWORD=titanpass
      - POSTGRES_DB=titansystem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
