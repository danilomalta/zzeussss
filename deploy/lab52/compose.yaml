services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LAB_ADMIN_PASSWORD:?}
      POSTGRES_DB: titan_lab52
      TITAN_LAB_DB_PASSWORD: ${LAB_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/01-titan.sh:ro
      - ./base.sql:/titan-base.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d titan_lab52"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [lab]
    # Only HTTP is published. PostgreSQL 5432 remains unpublished.
    ports: ["127.0.0.1:18080:8080"]
    labels:
      com.titansystem.lab-instance: ${LAB_INSTANCE:?}
  migrate:
    image: titansystem-lab52-api:local
    build:
      context: ../..
      dockerfile: deploy/lab52/Dockerfile
    entrypoint: ["/usr/local/bin/titan-lab-migrate"]
    command: ["migrate"]
    environment: &db
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: titan_lab52
      DB_USER: titan_app
      DB_PASSWORD: ${LAB_DB_PASSWORD:?}
      DB_SSLMODE: disable
    network_mode: "service:postgres"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.titansystem.lab-instance: ${LAB_INSTANCE:?}
  api:
    image: titansystem-lab52-api:local
    stop_grace_period: 60s
    build:
      context: ../..
      dockerfile: deploy/lab52/Dockerfile
    environment:
      <<: *db
      JWT_SECRET: ${LAB_JWT_SECRET:?}
      TITAN_API_HOST: "0.0.0.0"
      PORT: "8080"
      ALLOWED_ORIGINS: "http://127.0.0.1:18080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/saude | grep -q '\"status\":\"ativo\"'"]
      interval: 3s
      timeout: 3s
      retries: 30
    network_mode: "service:postgres"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.titansystem.lab-instance: ${LAB_INSTANCE:?}
networks:
  lab: {}
volumes:
  pgdata:
    name: titansystem_lab52_pgdata
    labels:
      com.titansystem.lab-instance: ${LAB_INSTANCE:?}
