name: Backend pilot acceptance

on:
  push:
    branches: [main, develop, "integration/**", "feat/backend-*", feat/backend-b02a-compat]
  pull_request:
    branches: [main, develop, "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-pilot:
    name: Real HTTP, PostgreSQL, SQLite, frontend bridges and recovery
    runs-on: ubuntu-latest
    # Full suite (30m), fiscal race (5m + 20m), trade/cash race (20m), builds and evidence.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: titan_ci
          POSTGRES_PASSWORD: ephemeral-ci-fixture-only
          POSTGRES_DB: titan_integration_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U titan_ci -d titan_integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Verify acceptance gate regressions
        run: python3 -m unittest discover -s ../tools/tests -p test_verify_backend_acceptance.py -v
      - name: Validate API contracts and complete route map
        run: |
          python3 -m unittest discover -s ../tools/tests -p test_api_contracts.py -v
          python3 ../tools/check_api_contracts.py
      - name: Receivables browser and HTTP prerequisites
        env:
          TITAN_RECEIVABLES_BRIDGE: ${{ github.workspace }}/frontend-web/tests/receivables.bridge.mjs
          TITAN_RECEIVABLES_BROWSER_BRIDGE: ${{ github.workspace }}/frontend-web/tests/receivables.browser.mjs
        run: |
          command -v google-chrome
          go test ./internal/localapi -run '^TestReceivables(CustomerOrderFrontendBridge|FrontendRealHTTPBridge|BrowserRestartRecovery)$' -timeout 120s -count=1 -json > "$RUNNER_TEMP/receivables-prerequisites.jsonl"
      - name: Vet backend
        run: go vet ./...
      - name: Build real executables
        run: |
          set -euo pipefail
          for tool in titan-local titan-backup titan-access titan-peer titan-receive titan-sync titan-trade titan-fiscal; do
            CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/$tool" "./cmd/$tool"
          done
      - name: Verify required browser
        run: command -v google-chrome
      - name: Install locked dependencies for rendered checkout acceptance
        run: npm ci --prefix ../frontend-web
      - name: Full backend regression suite with mandatory real integrations
        env:
          TITAN_TRADE_QUEUE: "1"
          TITAN_TRADE_CLI: ${{ runner.temp }}/titan-trade
          TITAN_SESSION_TEST_DATABASE_URL: postgres://titan_ci:ephemeral-ci-fixture-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/titan_integration_test?sslmode=disable
          TITAN_CATALOG_TEST_DATABASE_URL: postgres://titan_ci:ephemeral-ci-fixture-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/titan_integration_test?sslmode=disable
          TITAN_CASH_JOURNAL_BRIDGE: ${{ github.workspace }}/frontend-web/tests/cashJournal.bridge.mjs
          TITAN_DELIVERY_BRIDGE: ${{ github.workspace }}/frontend-web/tests/deliveryCycle.bridge.mjs
          TITAN_MAINTENANCE_BRIDGE: ${{ github.workspace }}/frontend-web/tests/internalMaintenance.bridge.mjs
          TITAN_FISCAL_CUSTOMER_BRIDGE: ${{ github.workspace }}/frontend-web/tests/fiscalCustomer.bridge.mjs
          TITAN_FISCAL_CLI: ${{ runner.temp }}/titan-fiscal
          TITAN_RECEIVABLES_BRIDGE: ${{ github.workspace }}/frontend-web/tests/receivables.bridge.mjs
          TITAN_RECEIVABLES_BROWSER_BRIDGE: ${{ github.workspace }}/frontend-web/tests/receivables.browser.mjs
          TITAN_CHECKOUT_NFCE_BRIDGE: ${{ github.workspace }}/frontend-web/tests/checkoutNFCe.bridge.mjs
          TITAN_CHECKOUT_FOCUS_SCREEN: ${{ github.workspace }}/frontend-web/tests/checkoutFocus.screen.mjs
        run: |
          set -euo pipefail
          go test ./... -count=1 -timeout=30m -json > "$RUNNER_TEMP/backend-full.jsonl"
          python3 ../tools/verify_backend_acceptance.py "$RUNNER_TEMP/backend-full.jsonl" | tee "$RUNNER_TEMP/backend-integrations.json"
      - name: Fiscal journal, session boundary and mTLS regressions with race detector
        run: |
          go test -race ./internal/fiscalcore ./internal/fiscalproduction -run '^TestRetainedST|^TestGoods|^TestInterstate|^TestDestination|^TestAdjusted|^TestTaxPolicy|^TestFiscalTransportRechecks|^TestFiscalMTLS|^TestFiscalIssuance|^TestFiscalQuery|^TestFiscalEmbeddedSchema|^TestFiscalCancellation|^TestFiscalInvalidation|^TestFiscalDANFE|^TestProduction' -count=1 -timeout=5m -json > "$RUNNER_TEMP/fiscal-journal-core-race.jsonl"
          # Separate processes keep every case and the same deadline; both must pass.
          go test -race ./internal/localapi -run '^TestFiscalTax|^TestFiscalTransmission|^TestFiscalInvoiceBinding|^TestFiscalNumbering|^TestFiscalQuerySQL|^TestFiscalCancellationSQL|^TestFiscalInvalidationSQL|^TestHTTPFiscalDANFE' -count=1 -timeout=20m -json -args -pilot-backup-cli="$RUNNER_TEMP/titan-backup" > "$RUNNER_TEMP/fiscal-journal-local-race-events.jsonl" &
          events_pid=$!
          go test -race ./internal/localapi -run '^TestHTTPFiscalRetainedST|^TestHTTPFiscalTaxPricedSale|^TestHTTPFiscalProduction' -count=1 -timeout=20m -json -args -pilot-backup-cli="$RUNNER_TEMP/titan-backup" > "$RUNNER_TEMP/fiscal-journal-local-race-sales.jsonl" &
          sales_pid=$!
          events_status=0
          wait "$events_pid" || events_status=$?
          sales_status=0
          wait "$sales_pid" || sales_status=$?
          test "$events_status" -eq 0
          test "$sales_status" -eq 0
          cat "$RUNNER_TEMP/backend-full.jsonl" \
            "$RUNNER_TEMP/fiscal-journal-local-race-events.jsonl" \
            "$RUNNER_TEMP/fiscal-journal-local-race-sales.jsonl" > "$RUNNER_TEMP/backend-combined.jsonl"
          python3 ../tools/verify_backend_acceptance.py "$RUNNER_TEMP/backend-combined.jsonl" | tee "$RUNNER_TEMP/backend-combined-integrations.json"
      - name: Company trade and cash pilots with real CLI and race detector
        run: |
          set -euo pipefail
          env -u TITAN_SESSION_TEST_DATABASE_URL -u TITAN_CATALOG_TEST_DATABASE_URL \
            -u TITAN_CASH_JOURNAL_BRIDGE -u TITAN_DELIVERY_BRIDGE -u TITAN_MAINTENANCE_BRIDGE -u TITAN_FISCAL_CUSTOMER_BRIDGE \
            go test -race ./internal/localapi \
            -run '^TestTrade|^TestHTTPCustomerReturn|^TestPilotCash(SaleToSupplierFinanceRestartAndRestore|PartialReceiptDiscrepancyRestartAndRestore|AuthenticatedSupplierRestartAndRestore|CustomerReturnRestartAndRestore)$' \
            -count=1 -v -timeout=20m -args -pilot-backup-cli="$RUNNER_TEMP/titan-backup" -pilot-trade-cli="$RUNNER_TEMP/titan-trade" -pilot-trade-queue \
            | tee "$RUNNER_TEMP/pilot-cli-race.log"
      - name: Sanitize structural evidence for this commit
        if: always()
        run: python3 ../.github/scripts/ci_evidence.py "$RUNNER_TEMP" "$RUNNER_TEMP/sanitized" "$GITHUB_SHA"
      - name: Upload execution evidence and Linux binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-pilot-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/sanitized/
            ${{ runner.temp }}/titan-backup
            ${{ runner.temp }}/titan-local
            ${{ runner.temp }}/titan-access
            ${{ runner.temp }}/titan-peer
            ${{ runner.temp }}/titan-receive
            ${{ runner.temp }}/titan-sync
            ${{ runner.temp }}/titan-trade
            ${{ runner.temp }}/titan-fiscal
