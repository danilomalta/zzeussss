name: Backend pilot acceptance

on:
  push:
    branches: [feat/backend-b02a-compat]
    paths: ['backend/**', '.github/workflows/backend-pilot.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-pilot:
    name: Real HTTP, SQLite, restart and backup executable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.8'
          cache-dependency-path: backend/go.sum
      - name: Vet backend
        run: go vet ./...
      - name: Build real executables
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/titan-backup" ./cmd/titan-backup
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/titan-local" ./cmd/titan-local
      - name: Full backend regression suite
        run: |
          set -euo pipefail
          env -u TITAN_SESSION_TEST_DATABASE_URL -u TITAN_CATALOG_TEST_DATABASE_URL \
            -u TITAN_CASH_JOURNAL_BRIDGE -u TITAN_DELIVERY_BRIDGE -u TITAN_MAINTENANCE_BRIDGE \
            go test ./... -count=1 -json > "$RUNNER_TEMP/backend-full.jsonl"
      - name: Full and partial cash pilots with real CLI and race detector
        run: |
          set -euo pipefail
          env -u TITAN_SESSION_TEST_DATABASE_URL -u TITAN_CATALOG_TEST_DATABASE_URL \
            -u TITAN_CASH_JOURNAL_BRIDGE -u TITAN_DELIVERY_BRIDGE -u TITAN_MAINTENANCE_BRIDGE \
            go test -race ./internal/localapi \
            -run '^TestPilotCash(SaleToSupplierFinanceRestartAndRestore|PartialReceiptDiscrepancyRestartAndRestore)$' \
            -count=1 -v -timeout=10m -args -pilot-backup-cli="$RUNNER_TEMP/titan-backup" \
            | tee "$RUNNER_TEMP/pilot-cli-race.log"
      - name: Upload execution evidence and Linux binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-pilot-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/backend-full.jsonl
            ${{ runner.temp }}/pilot-cli-race.log
            ${{ runner.temp }}/titan-backup
            ${{ runner.temp }}/titan-local
