name: Desktop launcher and runtime checks

on:
  push:
    branches: [main, develop, "integration/**", "feat/backend-*", feat/backend-checkout-authority]
  pull_request:
    branches: [main, develop, "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Desktop runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Runtime boundaries, compiled integrity and no automatic build
        run: |
          set -euo pipefail
          node --test --test-isolation=none desktop/tests/*.test.cjs | tee "$RUNNER_TEMP/desktop-runtime.log"
      - name: Record exact source revision
        if: always()
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/desktop-runtime-commit.txt"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-runtime-${{ github.sha }}
          retention-days: 14
          path: ${{ runner.temp }}/desktop-runtime-commit.txt
