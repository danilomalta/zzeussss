name: Desktop installer acceptance

on:
  push:
    branches: [main, develop, "integration/**", "feat/backend-*"]
  pull_request:
    branches: [main, develop, "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked build dependencies in disposable runner
        run: |
          npm ci --prefix frontend-web
          npm ci --prefix desktop
      - name: Runtime regressions
        run: node --test --test-isolation=none desktop/tests/*.test.cjs
      - name: Build compiled ERP stage without Vite server or env files
        run: node desktop/scripts/build.mjs
      - name: Prepare Linux Electron sandbox helper
        if: runner.os == 'Linux'
        run: |
          node -e 'require("./desktop/node_modules/electron")'
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Verify real Chromium print output (no physical printer)
        shell: bash
        run: node desktop/scripts/verify-print.cjs "$RUNNER_TEMP/print-evidence"
      - name: Package platform installer
        working-directory: desktop
        run: |
          set -euo pipefail
          stage="$(node -e 'const p=require("node:path"),f=require("node:fs");console.log(p.resolve(".build",JSON.parse(f.readFileSync(".build/current.json")).stage))')"
          if [[ "$RUNNER_OS" == "Windows" ]]; then target=(--win nsis); else target=(--linux deb); fi
          extra=()
          if [[ "$RUNNER_OS" != "Windows" ]]; then extra=(--config.linux.maintainer="TitanSystem CI <ci@example.invalid>"); fi
          npx --no-install electron-builder --projectDir "$stage" --config "$GITHUB_WORKSPACE/desktop/electron-builder.yml" --config.directories.output="$RUNNER_TEMP/titan-release" --publish never "${extra[@]}" "${target[@]}"
      - name: Install Linux package in fresh runner
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test ! -d /opt/TitanSystem
          mapfile -t packages < <(find "$RUNNER_TEMP/titan-release" -maxdepth 1 -name '*.deb')
          test "${#packages[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install -y "${packages[0]}"
          executable="$(dpkg -L titansystem-desktop | awk '/\/opt\/.*\/titansystem-desktop$/ {print;exit}')"
          test -x "$executable"
          xvfb-run -a node desktop/scripts/verify-installed.cjs "$executable" "$RUNNER_TEMP/installed-evidence"
      - name: Install and open Windows package in fresh runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem "$env:RUNNER_TEMP/titan-release" -Filter *.exe)
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'titan-clean-install'
          if (Test-Path $destination) { throw 'Install path already exists' }
          $installed = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /currentuser /D=$destination" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer exit $($installed.ExitCode)" }
          $binary = Join-Path $destination 'TitanSystem.exe'
          if (!(Test-Path $binary)) {
            Get-ChildItem $destination -Recurse -File | Select-Object FullName
            throw 'Installed executable not found'
          }
          node desktop/scripts/verify-installed.cjs "$binary" "$env:RUNNER_TEMP/installed-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: runner.os == 'Windows'
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Build Windows native business and backup executables
        if: runner.os == 'Windows'
        working-directory: backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory "$env:RUNNER_TEMP/business-bin" | Out-Null
          foreach ($tool in @('titan-local', 'titan-backup')) {
            $env:CGO_ENABLED = '0'
            go build -trimpath -o "$env:RUNNER_TEMP/business-bin/$tool.exe" "./cmd/$tool"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows existing SQLite reopen regression
        if: runner.os == 'Windows'
        working-directory: backend
        shell: pwsh
        run: |
          go test ./internal/privatefile -timeout 120s -count=1 -json > "$env:RUNNER_TEMP/windows-privacy.jsonl"
          $result = $LASTEXITCODE
          python ../.github/scripts/installed_diagnostics.py "$env:RUNNER_TEMP/windows-privacy.jsonl"
          if ($result -ne 0) { exit $result }
          go test ./internal/privatefile -run '^TestConcurrentPrivate(Publication|WriteNew)$' -timeout 120s -count=50 -json > "$env:RUNNER_TEMP/windows-publication-concurrency.jsonl"
          $result = $LASTEXITCODE
          python ../.github/scripts/installed_diagnostics.py "$env:RUNNER_TEMP/windows-publication-concurrency.jsonl"
          if ($result -ne 0) { exit $result }
          go test ./internal/localdb -run '^TestCreateReopenAndRepeatMigration$' -timeout 120s -count=1 -json > "$env:RUNNER_TEMP/windows-sqlite.jsonl"
          $result = $LASTEXITCODE
          python ../.github/scripts/installed_diagnostics.py "$env:RUNNER_TEMP/windows-sqlite.jsonl"
          if ($result -ne 0) { exit $result }
      - name: Windows customer owner and private key lifecycle
        if: runner.os == 'Windows'
        working-directory: backend
        shell: pwsh
        env:
          TITAN_INSTALLED_LOCAL: ${{ runner.temp }}/business-bin/titan-local.exe
        run: |
          go test ./cmd/titan-local -run '^TestWindowsCustomerNativeInitialization$' -timeout 120s -count=1 -json > "$env:RUNNER_TEMP/windows-customer-init.jsonl"
          $result = $LASTEXITCODE
          python ../.github/scripts/installed_diagnostics.py "$env:RUNNER_TEMP/windows-customer-init.jsonl"
          if ($result -ne 0) { exit $result }
          go test ./internal/fiscalproduction -run '^TestWindows(CustomerKeyLifecycle|VaultSQLiteURIIdentity)$' -timeout 120s -count=1 -json > "$env:RUNNER_TEMP/windows-customer-keys.jsonl"
          $result = $LASTEXITCODE
          python ../.github/scripts/installed_diagnostics.py "$env:RUNNER_TEMP/windows-customer-keys.jsonl"
          exit $result
      - name: Installed Windows business recovery and encrypted restore
        if: runner.os == 'Windows'
        working-directory: backend
        shell: pwsh
        env:
          TITAN_INSTALLED_DESKTOP: ${{ runner.temp }}/titan-clean-install/TitanSystem.exe
          TITAN_INSTALLED_LOCAL: ${{ runner.temp }}/business-bin/titan-local.exe
          TITAN_INSTALLED_BACKUP: ${{ runner.temp }}/business-bin/titan-backup.exe
          TITAN_INSTALLED_SCREEN: ${{ github.workspace }}/desktop/scripts/verify-initialization.cjs
        run: |
          go test ./internal/localapi -run '^TestPilotInstalledCashPartialReceivingRestore$' -timeout 120s -count=1 -json > "$env:RUNNER_TEMP/installed-windows-business.jsonl"
          $result = $LASTEXITCODE
          python ../.github/scripts/installed_diagnostics.py "$env:RUNNER_TEMP/installed-windows-business.jsonl"
          if ($result -ne 0) { exit $result }
          go test ./internal/localapi -run '^TestPilotInstalledCashClosingCustodyRestore$' -timeout 120s -count=1 -json > "$env:RUNNER_TEMP/installed-windows-closing.jsonl"
          $result = $LASTEXITCODE
          python ../.github/scripts/installed_diagnostics.py "$env:RUNNER_TEMP/installed-windows-closing.jsonl"
          exit $result
      - name: Upload installers and observed startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-install-${{ matrix.os }}-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/titan-release/*.exe
            ${{ runner.temp }}/titan-release/*.deb
            ${{ runner.temp }}/installed-evidence/*.json
            ${{ runner.temp }}/installed-evidence/*.png
            ${{ runner.temp }}/print-evidence/*.json
            ${{ runner.temp }}/print-evidence/*.pdf
  linux-backend:
    name: Linux backend installer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Build actual managed binaries
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/backend-bin"
          for tool in titan-local titan-sync titan-receive titan-peer titan-access titan-backup; do
            CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/backend-bin/$tool" "./cmd/$tool"
            chmod 700 "$RUNNER_TEMP/backend-bin/$tool"
          done
      - name: Install, initialize and recheck discarded installation
        run: python3 -B tools/verify_clean_backend_install.py --binaries "$RUNNER_TEMP/backend-bin" --report "$RUNNER_TEMP/backend-install.json"
      - name: Upload installation result only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-backend-install-${{ github.sha }}
          path: ${{ runner.temp }}/backend-install.json
