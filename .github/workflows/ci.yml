name: TitanSystem CI

# Pipeline principal para integração contínua do ecossistema.
# Roda lint e testes automatizados para manter a estabilidade do código mestre.

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-checks:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.0' # Alinhado à versão 1.25 do projeto

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2

      - name: Run Backend Lint
        working-directory: ./backend
        run: |
          # Executa checagem de linter estrito
          # (pode ser executado diretamente ou comentando se não houver configurações globais complexas)
          go vet ./...

      - name: Run Backend Tests
        working-directory: ./backend
        run: go test -v ./...

  frontend-checks:
    name: Frontend CI (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./frontend-web
        run: npm ci

      - name: Run Frontend Lint / Typecheck
        working-directory: ./frontend-web
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Run Frontend Tests
        working-directory: ./frontend-web
        run: |
          # Comando para rodar testes automatizados do React
          # Executa npm test se configurado, ou build teste
          npm run build
