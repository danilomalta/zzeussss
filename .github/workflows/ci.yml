name: TitanSystem CI

# Pipeline principal para integração contínua do ecossistema.
# Roda lint e testes automatizados para manter a estabilidade do código mestre.

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop", "integration/piloto-main-20261027" ]

jobs:
  backend-checks:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: backend/go.mod

      - name: Run Backend Lint
        working-directory: ./backend
        run: |
          # Executa checagem de linter estrito
          # (pode ser executado diretamente ou comentando se não houver configurações globais complexas)
          go vet ./...

      - name: Run Backend Tests
        working-directory: ./backend
        run: go test -v ./...

  frontend-checks:
    name: Frontend CI (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./frontend-web
        run: npm ci

      - name: Run Frontend Lint / Typecheck
        working-directory: ./frontend-web
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Run Frontend Tests
        working-directory: ./frontend-web
        run: |
          npm run test:all
          npm run build

      - name: Test Isolated Demo Helper
        run: python3 -B -m unittest discover -s tools/tests -v
