name: TitanSystem CI

# Pipeline principal para integração contínua do ecossistema.
# Roda lint e testes automatizados para manter a estabilidade do código mestre.

on:
  push:
    branches: [main, develop, "integration/**", "feat/backend-*"]
  pull_request:
    branches: [main, develop, "integration/**"]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed immutable revision
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Run Backend Lint
        working-directory: ./backend
        run: |
          # Executa checagem de linter estrito
          # (pode ser executado diretamente ou comentando se não houver configurações globais complexas)
          go vet ./...

      - name: Run Backend Tests
        working-directory: ./backend
        # The complete localapi suite outgrew Go's default 10-minute package
        # budget. Keep a finite deadline; assertions and test scope stay intact.
        run: go test -timeout=30m -v ./...

  frontend-checks:
    name: Frontend CI (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, reviewed immutable revision
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Dependencies
        working-directory: ./frontend-web
        run: npm ci

      - name: Run Frontend Lint / Typecheck
        working-directory: ./frontend-web
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Run Frontend Tests
        working-directory: ./frontend-web
        run: |
          npm run test:all
          npm run build

      - name: Evidence sanitizer regressions
        run: python3 -B -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Test Isolated Demo Helper
        run: python3 -B -m unittest discover -s tools/tests -v
