appId: com.titansystem.erp
productName: TitanSystem
asar: true
directories:
  output: release
files:
  - main.cjs
  - preload.cjs
  - src/**/*.cjs
  - setup/**/*
  - ui/**/*
  - build-manifest.json
  - package.json
linux:
  category: Office
  target:
    - AppImage
    - deb
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
